version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tablofy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tablofy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: tablofy_prod
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tablofy -d tablofy_prod']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tablofy-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}'

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tablofy-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
      DATABASE_URL: postgresql://tablofy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/tablofy_prod?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (min 32 chars)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set (min 32 chars)}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      CORS_CREDENTIALS: 'true'
      THROTTLE_TTL: '60'
      THROTTLE_LIMIT: '120'
      CLEANUP_SESSION_RETENTION_DAYS: ${CLEANUP_SESSION_RETENTION_DAYS:-30}
      CLEANUP_TOKEN_RETENTION_DAYS: ${CLEANUP_TOKEN_RETENTION_DAYS:-7}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      HEALTH_DISK_PATH: ${HEALTH_DISK_PATH:-/}
      HEALTH_DISK_THRESHOLD_MB: ${HEALTH_DISK_THRESHOLD_MB:-200}
      HEALTH_MEMORY_RSS_LIMIT_MB: ${HEALTH_MEMORY_RSS_LIMIT_MB:-512}
      # Trust the reverse proxy (nginx/ALB) so X-Forwarded-For drives the per-IP
      # rate limiter. Use the hop count (1 for a single proxy).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_AUTH_USER: ${SWAGGER_AUTH_USER:-}
      SWAGGER_AUTH_PASSWORD: ${SWAGGER_AUTH_PASSWORD:-}
      COMPRESSION_ENABLED: ${COMPRESSION_ENABLED:-true}
      COMPRESSION_THRESHOLD_BYTES: ${COMPRESSION_THRESHOLD_BYTES:-1024}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:-}
      SSO_CALLBACK_BASE_URL: ${SSO_CALLBACK_BASE_URL:-}
      SSO_SUCCESS_REDIRECT_URL: ${SSO_SUCCESS_REDIRECT_URL:-}
      SSO_FAILURE_REDIRECT_URL: ${SSO_FAILURE_REDIRECT_URL:-}
      SSO_STATE_TTL_SECONDS: ${SSO_STATE_TTL_SECONDS:-600}
      SSO_EXCHANGE_CODE_TTL_SECONDS: ${SSO_EXCHANGE_CODE_TTL_SECONDS:-60}
      EXPORT_DIR: ${EXPORT_DIR:-/app/exports}
      REPORT_EXPORT_RETENTION_DAYS: ${REPORT_EXPORT_RETENTION_DAYS:-30}
      QUEUE_DLQ_ALERT_THRESHOLD: ${QUEUE_DLQ_ALERT_THRESHOLD:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_DIR: ${LOG_DIR:-logs}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-14d}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-100m}
      LOG_CONSOLE: ${LOG_CONSOLE:-true}
      MONITOR_SLOW_QUERY_MS: ${MONITOR_SLOW_QUERY_MS:-100}
      MONITOR_SLOW_REQUEST_MS: ${MONITOR_SLOW_REQUEST_MS:-500}
      MONITOR_QUEUE_DELAY_MS: ${MONITOR_QUEUE_DELAY_MS:-1000}
      MONITOR_LARGE_PAYLOAD_BYTES: ${MONITOR_LARGE_PAYLOAD_BYTES:-1048576}
      MONITOR_HIGH_MEMORY_MB: ${MONITOR_HIGH_MEMORY_MB:-500}
      API_KEY_PREFIX: ${API_KEY_PREFIX:-tab_}
      API_KEY_LENGTH: ${API_KEY_LENGTH:-48}
      API_KEY_MAX_KEYS_PER_TENANT: ${API_KEY_MAX_KEYS_PER_TENANT:-20}
      API_KEY_RATE_LIMIT_PER_MIN: ${API_KEY_RATE_LIMIT_PER_MIN:-60}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ENDPOINT: ${METRICS_ENDPOINT:-metrics}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN must be set to secure /metrics}
      METRICS_COLLECT_DEFAULT: ${METRICS_COLLECT_DEFAULT:-true}
      METRICS_COLLECT_INTERVAL_MS: ${METRICS_COLLECT_INTERVAL_MS:-10000}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-live}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-0}
      PAYMOB_API_BASE: ${PAYMOB_API_BASE:-https://accept.paymob.com/api}
      PAYMOB_WEBHOOK_SECRET: ${PAYMOB_WEBHOOK_SECRET:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY must be set (min 32 chars)}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-5}
      WEBHOOK_INITIAL_BACKOFF_MS: ${WEBHOOK_INITIAL_BACKOFF_MS:-1000}
      WEBHOOK_BACKOFF_FACTOR: ${WEBHOOK_BACKOFF_FACTOR:-2}
      WEBHOOK_MAX_BACKOFF_MS: ${WEBHOOK_MAX_BACKOFF_MS:-3600000}
      WEBHOOK_DELIVERY_TIMEOUT_MS: ${WEBHOOK_DELIVERY_TIMEOUT_MS:-30000}
      WEBHOOK_MAX_REGISTRATIONS_PER_TENANT: ${WEBHOOK_MAX_REGISTRATIONS_PER_TENANT:-50}
      WEBHOOK_SECRET_ROTATION_DAYS: ${WEBHOOK_SECRET_ROTATION_DAYS:-90}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set (production requires a mail transport)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set (production requires a sender address)}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-}
      UPLOAD_MAX_IMAGE_SIZE_BYTES: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:-5242880}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      HEALTH_DEPENDENCY_TIMEOUT_MS: ${HEALTH_DEPENDENCY_TIMEOUT_MS:-5000}
    volumes:
      - exports_data:/app/exports
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # TLS termination + load balancing in front of the api replicas. Terminates
  # HTTPS, redirects HTTP, upgrades WebSockets and forwards X-Forwarded-For so
  # the API's per-IP rate limiting works. Scale the api service with
  # `docker compose ... up -d --scale api=3`; nginx balances across replicas.
  nginx:
    image: nginx:1.27-alpine
    container_name: tablofy-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SERVER_NAME: ${SERVER_NAME:-api.example.com}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${TLS_CERT_PATH:-./nginx/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./nginx/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
      - ./nginx/webroot:/var/www/certbot
    depends_on:
      - api
    networks:
      - tablofy-network

  # Nightly encrypted pg_dump uploaded offsite via rclone (S3/B2/GDrive/Spaces).
  # Provide an rclone config at ${RCLONE_CONFIG_HOST:-./rclone} and a remote
  # named ${RCLONE_REMOTE:-offsite}. Manual run:
  #   docker compose -f docker/docker-compose.prod.yml run --rm --entrypoint /usr/local/bin/run-backup.sh backup
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: tablofy-backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tablofy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/tablofy_prod?schema=public
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-offsite}
      RCLONE_PATH: ${RCLONE_PATH:-tablofy/backups}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ${RCLONE_CONFIG_HOST:-./rclone}:/config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tablofy-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  exports_data:
    driver: local
  uploads_data:
    driver: local

networks:
  tablofy-network:
    driver: bridge
