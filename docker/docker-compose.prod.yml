version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tablofy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tablofy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: tablofy_prod
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tablofy -d tablofy_prod']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tablofy-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}'

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tablofy-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
      DATABASE_URL: postgresql://tablofy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/tablofy_prod?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      CORS_CREDENTIALS: 'true'
      THROTTLE_TTL: '60'
      THROTTLE_LIMIT: '120'
      CLEANUP_SESSION_RETENTION_DAYS: ${CLEANUP_SESSION_RETENTION_DAYS:-30}
      CLEANUP_TOKEN_RETENTION_DAYS: ${CLEANUP_TOKEN_RETENTION_DAYS:-7}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      HEALTH_DISK_PATH: ${HEALTH_DISK_PATH:-/}
      HEALTH_DISK_THRESHOLD_MB: ${HEALTH_DISK_THRESHOLD_MB:-200}
      QUEUE_DLQ_ALERT_THRESHOLD: ${QUEUE_DLQ_ALERT_THRESHOLD:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_DIR: ${LOG_DIR:-logs}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-14d}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-100m}
      LOG_CONSOLE: ${LOG_CONSOLE:-true}
      MONITOR_SLOW_QUERY_MS: ${MONITOR_SLOW_QUERY_MS:-100}
      MONITOR_SLOW_REQUEST_MS: ${MONITOR_SLOW_REQUEST_MS:-500}
      MONITOR_QUEUE_DELAY_MS: ${MONITOR_QUEUE_DELAY_MS:-1000}
      MONITOR_LARGE_PAYLOAD_BYTES: ${MONITOR_LARGE_PAYLOAD_BYTES:-1048576}
      MONITOR_HIGH_MEMORY_MB: ${MONITOR_HIGH_MEMORY_MB:-500}
      API_KEY_PREFIX: ${API_KEY_PREFIX:-tab_}
      API_KEY_LENGTH: ${API_KEY_LENGTH:-48}
      API_KEY_MAX_KEYS_PER_TENANT: ${API_KEY_MAX_KEYS_PER_TENANT:-20}
      API_KEY_RATE_LIMIT_PER_MIN: ${API_KEY_RATE_LIMIT_PER_MIN:-60}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ENDPOINT: ${METRICS_ENDPOINT:-metrics}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN}
      METRICS_COLLECT_DEFAULT: ${METRICS_COLLECT_DEFAULT:-true}
      METRICS_COLLECT_INTERVAL_MS: ${METRICS_COLLECT_INTERVAL_MS:-10000}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-live}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-0}
      PAYMOB_API_BASE: ${PAYMOB_API_BASE:-https://accept.paymob.com/api}
      PAYMOB_WEBHOOK_SECRET: ${PAYMOB_WEBHOOK_SECRET:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-5}
      WEBHOOK_INITIAL_BACKOFF_MS: ${WEBHOOK_INITIAL_BACKOFF_MS:-1000}
      WEBHOOK_BACKOFF_FACTOR: ${WEBHOOK_BACKOFF_FACTOR:-2}
      WEBHOOK_MAX_BACKOFF_MS: ${WEBHOOK_MAX_BACKOFF_MS:-3600000}
      WEBHOOK_DELIVERY_TIMEOUT_MS: ${WEBHOOK_DELIVERY_TIMEOUT_MS:-30000}
      WEBHOOK_MAX_REGISTRATIONS_PER_TENANT: ${WEBHOOK_MAX_REGISTRATIONS_PER_TENANT:-50}
      WEBHOOK_SECRET_ROTATION_DAYS: ${WEBHOOK_SECRET_ROTATION_DAYS:-90}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tablofy-network:
    driver: bridge
