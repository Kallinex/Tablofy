version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tablofy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tablofy
      POSTGRES_PASSWORD: tablofy_dev
      POSTGRES_DB: tablofy_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tablofy -d tablofy_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tablofy-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - tablofy-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tablofy-network:
    driver: bridge
