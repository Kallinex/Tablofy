name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tablofy
          POSTGRES_PASSWORD: tablofy_dev
          POSTGRES_DB: tablofy_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U tablofy -d tablofy_dev
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint --ext .ts apps/api/src
        env:
          NODE_ENV: test

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Build
        run: npx nx build api
        env:
          NODE_ENV: production

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tablofy:tablofy_dev@localhost:5432/tablofy_dev?schema=public

      - name: Run tests
        run: |
          npm run start:api &
          sleep 10
          node verify-phase2a.js
          node verify-m4.js
          node verify-m5.js
          node verify-m6.js
          node verify-m7.js
          node verify-m8.js
          node verify-m9.js
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://tablofy:tablofy_dev@localhost:5432/tablofy_dev?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-must-be-at-least-32characters
          JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-32ch
