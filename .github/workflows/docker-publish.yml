name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          NAME="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${{ env.REGISTRY }}/${OWNER}/${NAME}"
          SHA_TAG="${{ github.sha }}"
          REF="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          TAGS="$IMAGE_NAME:$SHA_TAG"
          if [ "$REF" = "tag" ]; then
            TAGS="$TAGS,$IMAGE_NAME:$REF_NAME,$IMAGE_NAME:latest"
            case "$REF_NAME" in
              v[0-9]*.[0-9]*)
                MAJOR="$(echo "$REF_NAME" | cut -d. -f1)"
                TAGS="$TAGS,$IMAGE_NAME:$MAJOR"
                ;;
            esac
          else
            TAGS="$TAGS,$IMAGE_NAME:$REF_NAME"
          fi
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "scan_tag=$IMAGE_NAME:scan-$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.scan_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.scan_tag }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container

      # The image is only published after the vulnerability gate above passes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
