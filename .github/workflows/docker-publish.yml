name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          NAME="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${{ env.REGISTRY }}/${OWNER}/${NAME}"
          SHA_TAG="${{ github.sha }}"
          REF="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          TAGS="$IMAGE_NAME:$SHA_TAG"
          if [ "$REF" = "tag" ]; then
            TAGS="$TAGS,$IMAGE_NAME:$REF_NAME,$IMAGE_NAME:latest"
            case "$REF_NAME" in
              v[0-9]*.[0-9]*)
                MAJOR="$(echo "$REF_NAME" | cut -d. -f1)"
                TAGS="$TAGS,$IMAGE_NAME:$MAJOR"
                ;;
            esac
          else
            TAGS="$TAGS,$IMAGE_NAME:$REF_NAME"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
